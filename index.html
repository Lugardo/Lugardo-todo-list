<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Lugardo To Do List</title>
  <script>
    // Bump APP_VERSION on every release to force browsers to reload
    // styles.css and script.js. The version is appended as a query
    // string; the file contents are unaffected.
    window.APP_VERSION = "2026.04.19-1";
    document.write(
      '<link rel="stylesheet" href="styles.css?v=' + window.APP_VERSION + '">'
    );
  </script>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Lugardo <span class="accent">To Do List</span></h1>
    <p class="app-subtitle">Organiza tus tareas día a día</p>
  </header>

  <main class="app-main">
    <section class="calendar-section" aria-label="Calendario">
      <div class="calendar-toolbar">
        <button id="prevMonth" class="nav-btn" aria-label="Mes anterior">&larr;</button>
        <h2 id="monthLabel" class="month-label"></h2>
        <button id="nextMonth" class="nav-btn" aria-label="Mes siguiente">&rarr;</button>
        <button id="todayBtn" class="today-btn" aria-label="Ir a hoy">Hoy</button>
      </div>

      <div class="filter-bar">
        <label class="filter-label">Filtrar:</label>
        <select id="statusFilter" class="filter-select" aria-label="Filtrar por estado">
          <option value="all">Todos los estados</option>
          <option value="pendiente">Pendiente</option>
          <option value="en-proceso">En proceso</option>
          <option value="completado">Completado</option>
          <option value="cancelado">Cancelado</option>
          <option value="pospuesto">Pospuesto</option>
        </select>
      </div>

      <div class="weekdays" aria-hidden="true">
        <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
      </div>
      <div id="calendarGrid" class="calendar-grid" role="grid"></div>

      <div class="legend">
        <span class="legend-item"><span class="dot dot-pendiente"></span>Pendiente</span>
        <span class="legend-item"><span class="dot dot-en-proceso"></span>En proceso</span>
        <span class="legend-item"><span class="dot dot-completado"></span>Completado</span>
        <span class="legend-item"><span class="dot dot-cancelado"></span>Cancelado</span>
        <span class="legend-item"><span class="dot dot-pospuesto"></span>Pospuesto</span>
      </div>
    </section>
  </main>

  <aside id="taskPanel" class="task-panel" aria-hidden="true">
    <div class="panel-header">
      <div>
        <h3 id="panelDate" class="panel-date"></h3>
        <p id="panelSummary" class="panel-summary"></p>
      </div>
      <button id="closePanel" class="close-btn" aria-label="Cerrar panel">&times;</button>
    </div>

    <form id="taskForm" class="task-form">
      <input
        type="text"
        id="taskInput"
        class="task-input"
        placeholder="Nueva tarea…"
        maxlength="140"
      />
      <textarea
        id="taskBulkInput"
        class="task-bulk-input"
        placeholder="Una tarea por línea&#10;Comprar pan&#10;Llamar al dentista&#10;Terminar informe"
        rows="5"
        hidden
      ></textarea>
      <div class="task-form-actions">
        <button
          type="button"
          id="micBtn"
          class="mic-btn"
          aria-label="Dictar tarea"
          title="Dictar tarea por voz"
        >
          <span class="mic-icon" aria-hidden="true"></span>
          <span class="mic-label">Dictar</span>
        </button>
        <div class="time-picker" id="timePicker">
          <button type="button" class="time-trigger empty" id="timeTrigger" aria-haspopup="dialog" aria-expanded="false">
            <span class="time-icon" aria-hidden="true"></span>
            <span class="time-display" id="timeDisplay">Sin hora</span>
            <span class="time-clear-inline" id="timeClearInline" role="button" aria-label="Quitar hora" hidden>&times;</span>
          </button>
          <div class="time-popover" id="timePopover" role="dialog" aria-label="Seleccionar hora">
            <div class="time-popover-header">Hora de la tarea</div>
            <div class="time-wheels">
              <div class="time-wheel" id="hourWheel" role="listbox" aria-label="Hora"></div>
              <span class="time-sep" aria-hidden="true">:</span>
              <div class="time-wheel" id="minuteWheel" role="listbox" aria-label="Minutos"></div>
            </div>
            <div class="time-quick">
              <button type="button" data-time="08:00">08:00</button>
              <button type="button" data-time="09:00">09:00</button>
              <button type="button" data-time="12:00">12:00</button>
              <button type="button" data-time="15:00">15:00</button>
              <button type="button" data-time="18:00">18:00</button>
              <button type="button" data-time="20:00">20:00</button>
            </div>
            <div class="time-actions">
              <button type="button" id="timeClear" class="btn-secondary">Quitar</button>
              <button type="button" id="timeConfirm" class="btn-primary">Listo</button>
            </div>
          </div>
          <input type="hidden" id="taskTime" />
        </div>
        <button type="submit" class="add-btn">Agregar</button>
      </div>
      <div class="form-footer">
        <button type="button" id="modeToggle" class="mode-toggle" aria-pressed="false">
          <span class="mode-toggle-icon" aria-hidden="true"></span>
          <span class="mode-toggle-label">Modo lote</span>
        </button>
        <p id="micHint" class="mic-hint" aria-live="polite"></p>
      </div>
    </form>

    <ul id="taskList" class="task-list"></ul>
    <p id="emptyState" class="empty-state">No hay tareas para este día.</p>
  </aside>

  <div id="backdrop" class="backdrop" aria-hidden="true"></div>

  <div id="moveModal" class="move-modal" aria-hidden="true">
    <div class="move-modal-content">
      <h4>Mover tarea pospuesta</h4>
      <p id="moveTaskName" class="move-task-name"></p>
      <label for="moveDateInput">Nueva fecha:</label>
      <input type="date" id="moveDateInput" />
      <div class="move-modal-actions">
        <button id="cancelMove" class="btn-secondary">Cancelar</button>
        <button id="confirmMove" class="btn-primary">Mover</button>
      </div>
    </div>
  </div>

  <script>
    document.write(
      '<script src="script.js?v=' + window.APP_VERSION + '"><\/script>'
    );
  </script>
</body>
</html>
